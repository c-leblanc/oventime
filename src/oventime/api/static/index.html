<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OvenTime</title>
  <link rel="icon" type="image/png" href="/static/logo.png" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="manifest" href="/static/manifest.json" />
  <link rel="apple-touch-icon" href="/static/logo_wbg.png" />
  <style>
    :root {
      --bg:      #fef6e4;
      --surface: #fffdf7;
      --border:  rgba(214, 158, 46, 0.25);
      --shadow:  rgba(180, 120, 20, 0.12);
      --text:    #3b2a0e;
      --muted:   #a08050;
      --amber:   #f5a623;
      --accent:  #f5a623;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Nunito', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background-image:
        radial-gradient(ellipse 80% 60% at 50% 0%, rgba(245,166,35,0.10) 0%, transparent 70%);
    }
    .container { width: 100%; max-width: 440px; }
    .header {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      margin-bottom: 1.75rem;
    }
    .logo-img {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      box-shadow: 0 2px 10px var(--shadow);
    }
    .title-block { flex: 1; }
    .title-block h1 {
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      color: var(--text);
      line-height: 1.1;
    }
    .title-block .subtitle {
      font-size: 0.72rem;
      font-family: 'DM Mono', monospace;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-top: 2px;
    }
    .live-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 0.25rem 0.6rem;
      box-shadow: 0 1px 4px var(--shadow);
    }
    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #52c97e;
      animation: pulse 2.2s ease-in-out infinite;
      transition: background 0.8s;
    }
    .live-label {
      font-size: 0.6rem;
      font-family: 'DM Mono', monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.45; transform: scale(0.75); }
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 1.75rem;
      box-shadow: 0 2px 0 rgba(255,255,255,0.9) inset, 0 4px 20px var(--shadow);
      margin-bottom: 0.9rem;
    }
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--border);
    }
    .status-label {
      font-size: 0.68rem;
      font-family: 'DM Mono', monospace;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent);
      background: rgba(82, 201, 126, 0.12);
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      transition: color 0.8s, background 0.8s;
    }
    .score-section { margin-bottom: 1.5rem; }
    .score-meta {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 0.7rem;
    }
    .score-value {
      font-family: 'DM Mono', monospace;
      font-size: 3rem;
      font-weight: 500;
      line-height: 1;
      color: var(--accent);
      transition: color 0.8s;
    }
    .score-right { text-align: right; }
    .score-unit {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      color: var(--muted);
      letter-spacing: 0.08em;
    }
    .score-label {
      font-size: 0.7rem;
      color: var(--muted);
      font-weight: 600;
    }
    .bar-track {
      height: 6px;
      background: var(--border);
      border-radius: 6px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 6px;
      background: linear-gradient(90deg, var(--accent), #ffe082);
      transition: width 1s cubic-bezier(0.4, 0, 0.2, 1), background 0.8s;
    }
    .details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
    }
    .detail-cell {
      background: rgba(245,166,35,0.06);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.75rem 0.9rem;
    }
    .detail-key {
      font-size: 0.62rem;
      font-family: 'DM Mono', monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.25rem;
    }
    .detail-val {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
    }
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 0.25rem;
    }
    .timestamp {
      font-family: 'DM Mono', monospace;
      font-size: 0.6rem;
      color: var(--muted);
      letter-spacing: 0.06em;
    }
    .refresh-btn {
      font-family: 'Nunito', sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--amber);
      background: rgba(245,166,35,0.12);
      border: 1px solid rgba(245,166,35,0.3);
      padding: 0.3rem 0.75rem;
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .refresh-btn:hover { background: rgba(245,166,35,0.22); transform: scale(1.03); }
    .refresh-btn:active { transform: scale(0.97); }
    .error-msg {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      color: #e05050;
      text-align: center;
      padding: 0.75rem 0 0;
      display: none;
      letter-spacing: 0.04em;
    }

    /* ── Notification subscribe card ── */
    .notif-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 1.1rem 1.4rem;
      box-shadow: 0 2px 0 rgba(255,255,255,0.9) inset, 0 4px 20px var(--shadow);
      margin-bottom: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.9rem;
    }
    .notif-card.hidden { display: none; }
    .notif-icon {
      font-size: 1.6rem;
      flex-shrink: 0;
      line-height: 1;
    }
    .notif-text { flex: 1; min-width: 0; }
    .notif-title {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 0.15rem;
    }
    .notif-desc {
      font-size: 0.68rem;
      color: var(--muted);
      line-height: 1.4;
    }
    .notif-btn {
      flex-shrink: 0;
      font-family: 'Nunito', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      border-radius: 20px;
      padding: 0.4rem 0.9rem;
      cursor: pointer;
      border: 1px solid;
      transition: background 0.2s, transform 0.1s, opacity 0.2s;
      white-space: nowrap;
    }
    .notif-btn:hover  { transform: scale(1.04); }
    .notif-btn:active { transform: scale(0.97); }
    .notif-btn.subscribe {
      color: #fff;
      background: var(--amber);
      border-color: var(--amber);
    }
    .notif-btn.subscribe:hover { background: #e09510; border-color: #e09510; }
    .notif-btn.unsubscribe {
      color: var(--muted);
      background: transparent;
      border-color: var(--border);
    }
    .notif-btn.unsubscribe:hover { background: rgba(245,166,35,0.08); }
    .notif-btn:disabled { opacity: 0.5; cursor: default; transform: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img class="logo-img" src="/static/logo.png" alt="OvenTime logo" />
      <div class="title-block">
        <h1>OvenTime</h1>
        <div class="subtitle">Réseau électrique · France</div>
      </div>
      <div class="live-pill">
        <div class="live-dot" id="liveDot"></div>
        <span class="live-label">Live</span>
      </div>
    </div>

    <div class="card">
      <div class="status-row">
        <span class="status-label">État du réseau</span>
        <span class="status-badge" id="statusBadge">—</span>
      </div>
      <div class="score-section">
        <div class="score-meta">
          <div class="score-value" id="scoreValue">—</div>
          <div class="score-right">
            <div class="score-unit">/ 150 pts</div>
            <div class="score-label">Score réseau</div>
          </div>
        </div>
        <div class="bar-track">
          <div class="bar-fill" id="barFill" style="width: 0%"></div>
        </div>
      </div>
      <div class="details">
        <div class="detail-cell">
          <div class="detail-key">Gaz CCG</div>
          <div class="detail-val" id="detailGas">—</div>
        </div>
        <div class="detail-cell">
          <div class="detail-key">Nucléaire</div>
          <div class="detail-val" id="detailNuclear">—</div>
        </div>
        <div class="detail-cell">
          <div class="detail-key">Stockage</div>
          <div class="detail-val" id="detailStorage">—</div>
        </div>
        <div class="detail-cell">
          <div class="detail-key">Score brut</div>
          <div class="detail-val" id="detailScore">—</div>
        </div>
      </div>
    </div>

    <div class="footer">
      <span class="timestamp" id="timestamp">—</span>
      <button class="refresh-btn" onclick="fetchData()">↻ Actualiser</button>
    </div>

    <!-- ── Notification subscribe card ── -->
    <div class="notif-card hidden" id="notifCard" style="margin-top:0.9rem; margin-bottom:0">
      <div class="notif-icon" id="notifIcon">🔔</div>
      <div class="notif-text">
        <div class="notif-title" id="notifTitle">Alertes réseau</div>
        <div class="notif-desc" id="notifDesc">Sois notifié lors des périodes d'abondance 🍃 ou de forte tension 🔥</div>
      </div>
      <button class="notif-btn subscribe" id="notifBtn" onclick="toggleSubscription()">Activer</button>
    </div>

    <div class="error-msg" id="errorMsg">
      Impossible de contacter l'API — données de démo affichées
    </div>
  </div>

  <script>
    const API_URL = ""

    const STATUS_CONFIG = {
      leaf:   { label: "🍃 Abondance",  color: "#3cb96b" },
      green:  { label: "🟢 Vert",       color: "#52c97e" },
      orange: { label: "🟠 Tendu",      color: "#e8804a" },
      red:    { label: "🔴 Très tendu", color: "#e05050" },
      fire:   { label: "🔥 Critique",   color: "#cc2e2e" },
    }

    const $ = id => document.getElementById(id)
    const pct = v => v !== null && v !== undefined ? `${Math.round(v * 100)} %` : "—"
    const fmt = v => v !== null && v !== undefined ? v.toFixed(1) : "—"

    function setAccent(color) {
      document.documentElement.style.setProperty("--accent", color)
      $("liveDot").style.background = color
    }

    function render(data) {
      const cfg = STATUS_CONFIG[data.status] || { label: data.status, color: "#f5a623" }
      setAccent(cfg.color)
      $("statusBadge").textContent   = cfg.label
      $("statusBadge").style.color   = cfg.color
      $("statusBadge").style.background = cfg.color + "1a"
      $("scoreValue").textContent    = fmt(data.score)
      $("barFill").style.width       = `${Math.min(100, (data.score / 150) * 100)}%`
      const d = data.details || {}
      $("detailGas").textContent     = d.gasCCG_use_rate !== undefined ? pct(d.gasCCG_use_rate) : "—"
      $("detailNuclear").textContent = d.nuclear_use_rate !== undefined ? pct(d.nuclear_use_rate) : "—"
      $("detailStorage").textContent = d.storage_use_rate !== undefined ? pct(d.storage_use_rate) : "—"
      $("detailScore").textContent   = fmt(data.score)
      if (data.ts) {
        const dt = new Date(data.ts)
        $("timestamp").textContent = dt.toLocaleString("fr-FR", { dateStyle: "short", timeStyle: "short" })
      }
      $("errorMsg").style.display = "none"
    }

    async function fetchData() {
      try {
        const res = await fetch(`${API_URL}/diagnostic`)
        if (!res.ok) throw new Error(`HTTP ${res.status}`)
        render(await res.json())
      } catch (e) {
        console.error(e)
        $("errorMsg").style.display = "block"
        render(MOCK_DATA)
      }
    }

    const MOCK_DATA = {
      ts: new Date().toISOString(),
      status: "green",
      score: 87.4,
      details: { gasCCG_use_rate: 0.12, nuclear_use_rate: 0.94, storage_phase: 0.61 }
    }

    fetchData()
    setInterval(fetchData, 5 * 60 * 1000)

    // ══════════════════════════════════════════════════════════════════
    // NOTIFICATIONS PUSH
    // ══════════════════════════════════════════════════════════════════

    let _swRegistration = null   // ServiceWorkerRegistration
    let _vapidPublicKey  = null  // clé VAPID base64url

    // Convertit une clé VAPID base64url en Uint8Array (requis par subscribe())
    function urlBase64ToUint8Array(b64) {
      const padded = b64.padEnd(b64.length + (4 - b64.length % 4) % 4, "=")
      const raw = atob(padded.replace(/-/g, "+").replace(/_/g, "/"))
      return Uint8Array.from([...raw].map(c => c.charCodeAt(0)))
    }

    // Récupère la subscription active (ou null)
    async function getActiveSub() {
      if (!_swRegistration) return null
      return _swRegistration.pushManager.getSubscription()
    }

    // Met à jour l'UI de la carte selon l'état courant
    function setNotifState(state) {
      const card = $("notifCard")
      const btn  = $("notifBtn")
      const icon = $("notifIcon")
      const title = $("notifTitle")
      const desc  = $("notifDesc")

      card.classList.remove("hidden")
      btn.disabled = false

      if (state === "unsupported") {
        card.classList.add("hidden")
        return
      }
      if (state === "denied") {
        icon.textContent  = "🔕"
        title.textContent = "Notifications bloquées"
        desc.textContent  = "Active les notifications dans les réglages de ton navigateur."
        btn.style.display = "none"
        return
      }
      if (state === "subscribed") {
        icon.textContent  = "🔔"
        title.textContent = "Alertes activées"
        desc.textContent  = "Tu recevras une notif en cas d'abondance 🍃 ou de forte tension 🔥"
        btn.textContent   = "Désactiver"
        btn.className     = "notif-btn unsubscribe"
        btn.style.display = ""
        return
      }
      // default: "unsubscribed"
      icon.textContent  = "🔔"
      title.textContent = "Alertes réseau"
      desc.textContent  = "Sois notifié lors des périodes d'abondance 🍃 ou de forte tension 🔥"
      btn.textContent   = "Activer"
      btn.className     = "notif-btn subscribe"
      btn.style.display = ""
    }

    // Initialise le Service Worker et lit l'état au chargement
    async function initPush() {
      if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
        setNotifState("unsupported")
        return
      }

      // Enregistre le Service Worker
      try {
        _swRegistration = await navigator.serviceWorker.register(`/sw.js?appUrl=${encodeURIComponent(API_URL)}`, { scope: "/" })
      } catch (e) {
        console.error("SW registration failed:", e)
        setNotifState("unsupported")
        return
      }

      // Récupère la clé VAPID publique depuis l'API
      try {
        const r = await fetch(`${API_URL}/vapid-public-key`)
        const data = await r.json()
        _vapidPublicKey = data.publicKey
      } catch (e) {
        console.error("Could not fetch VAPID public key:", e)
        setNotifState("unsupported")
        return
      }

      // Affiche le bon état
      if (Notification.permission === "denied") {
        setNotifState("denied")
        return
      }
      const sub = await getActiveSub()
      setNotifState(sub ? "subscribed" : "unsubscribed")
    }

    async function toggleSubscription() {
      const btn = $("notifBtn")
      btn.disabled = true
      const sub = await getActiveSub()

      if (sub) {
        // ── Désabonnement ──
        try {
          await fetch(`${API_URL}/wsubs`, {
            method: "DELETE",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ endpoint: sub.endpoint }),
          })
          await sub.unsubscribe()
          setNotifState("unsubscribed")
        } catch (e) {
          console.error(e)
          btn.disabled = false
        }
      } else {
        // ── Abonnement ──
        let permission = Notification.permission
        if (permission === "default") {
          permission = await Notification.requestPermission()
        }
        if (permission !== "granted") {
          setNotifState("denied")
          return
        }
        try {
          const keyArray = urlBase64ToUint8Array(_vapidPublicKey)
          console.log('VAPID key:', _vapidPublicKey)
          console.log('VAPID key length:', _vapidPublicKey?.length)
          console.log('Key array length:', keyArray.length)
          const newSub = await _swRegistration.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: keyArray,
          })
          await fetch(`${API_URL}/wsubs`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(newSub.toJSON()),
          })
          setNotifState("subscribed")
        } catch (e) {
          console.error(e)
          btn.disabled = false
        }
      }
    }

    initPush()
  </script>
</body>
</html>
