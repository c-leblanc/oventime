<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OvenTime</title>
  <link rel="icon" type="image/png" href="/static/logo.png" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="manifest" href="/static/manifest.json" />
  <link rel="apple-touch-icon" href="/static/logo_wbg.png" />
  <style>
    :root {
      --bg:      #fef6e4;
      --surface: #fffdf7;
      --border:  rgba(214, 158, 46, 0.25);
      --shadow:  rgba(180, 120, 20, 0.12);
      --text:    #3b2a0e;
      --muted:   #a08050;
      --amber:   #f5a623;
      --accent:  #f5a623;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Nunito', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background-image:
        radial-gradient(ellipse 80% 60% at 50% 0%, rgba(245,166,35,0.10) 0%, transparent 70%);
    }
    .container { width: 100%; max-width: 440px; }
    .header {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      margin-bottom: 1.75rem;
    }
    .logo-img {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      box-shadow: 0 2px 10px var(--shadow);
    }
    .title-block { flex: 1; }
    .title-block h1 {
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      color: var(--text);
      line-height: 1.1;
    }
    .title-block .subtitle {
      font-size: 0.72rem;
      font-family: 'DM Mono', monospace;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-top: 2px;
    }
    .live-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 0.25rem 0.6rem;
      box-shadow: 0 1px 4px var(--shadow);
    }
    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #52c97e;
      animation: pulse 2.2s ease-in-out infinite;
      transition: background 0.8s;
    }
    .live-label {
      font-size: 0.6rem;
      font-family: 'DM Mono', monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.45; transform: scale(0.75); }
    }

    /* ── Carte principale : verdict ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 1.75rem;
      box-shadow: 0 2px 0 rgba(255,255,255,0.9) inset, 0 4px 20px var(--shadow);
      margin-bottom: 0.9rem;
    }
    .verdict {
      text-align: center;
      padding: 0.2rem 0 0.1rem;
    }
    .verdict-status {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--accent);
      transition: color 0.8s;
      margin-bottom: 0.3rem;
    }
    .verdict-hint {
      font-size: 0.82rem;
      color: var(--muted);
      font-weight: 600;
    }
    .gauge-outer {
      position: relative;
      margin-top: 0.3rem;
      padding-top: 16px;
      padding-bottom: 40px;
    }
    .gauge-title {
      font-size: 0.62rem;
      font-family: 'DM Mono', monospace;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.2rem;
    }
    .gauge-bg {
      position: absolute;
      left: 8.3%; right: 8.3%;
      top: 16px; height: 10px;
      background: var(--border);
      border-radius: 5px;
    }
    .gauge-fill {
      position: absolute;
      top: 16px; height: 10px;
      border-radius: 5px;
      z-index: 1;
      transition: left 1s cubic-bezier(0.4, 0, 0.2, 1),
                  width 1s cubic-bezier(0.4, 0, 0.2, 1),
                  background 0.8s;
    }
    .gauge-outline {
      position: absolute;
      left: 8.3%; right: 8.3%;
      top: 16px; height: 10px;
      border: 1.5px solid rgba(60, 40, 10, 0.18);
      border-radius: 5px;
      z-index: 2;
      pointer-events: none;
    }
    .gauge-label {
      position: absolute;
      top: 0;
      font-family: 'DM Mono', monospace;
      font-size: 0.55rem;
      color: var(--muted);
      transform: translateX(-50%);
    }
    .gauge-label-0   { left: 8.3%; }
    .gauge-label-100 { left: 91.7%; }
    .gauge-tri {
      position: absolute;
      top: 28px;
      font-size: 0.5rem;
      color: var(--text);
      transform: translateX(-50%);
      transition: left 1s cubic-bezier(0.4, 0, 0.2, 1);
      line-height: 1;
      z-index: 3;
    }
    .gauge-score {
      position: absolute;
      top: 37px;
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      font-weight: 400;
      color: var(--text);
      transform: translateX(-50%);
      transition: left 1s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 3;
    }

    /* ── Carte forward : fenêtre + timeline ── */
    .forward-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 1.4rem 1.4rem 1.1rem;
      box-shadow: 0 2px 0 rgba(255,255,255,0.9) inset, 0 4px 20px var(--shadow);
      margin-bottom: 0.9rem;
    }
    .forward-section-label {
      font-size: 0.62rem;
      font-family: 'DM Mono', monospace;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }
    .forward-window {
      font-size: 0.72rem;
      font-family: 'DM Mono', monospace;
      font-weight: 400;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text);
    }
    .timeline-bar { display: flex; height: 22px; gap: 2px; align-items: flex-end; position: relative; }
    .timeline-bar > div { flex: 1; min-width: 2px; border-radius: 2px; height: 100%; cursor: pointer; }
    .tl-tooltip {
      position: absolute;
      top: -20px;
      font-family: 'DM Mono', monospace;
      font-size: 0.58rem;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1px 5px;
      transform: translateX(-50%);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
      white-space: nowrap;
      z-index: 5;
    }
    .tl-tooltip.visible { opacity: 1; }
    .timeline-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.65rem;
      font-family: 'DM Mono', monospace;
      color: var(--muted);
      margin-top: 4px;
    }

    /* ── Détails techniques (ligne discrète) ── */
    .tech-strip {
      display: flex;
      justify-content: center;
      gap: 1.2rem;
      padding: 0.25rem 0.25rem 0;
      margin-bottom: -0.5rem;
    }
    .tech-item {
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }
    .tech-label {
      font-size: 0.58rem;
      font-family: 'DM Mono', monospace;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .tech-val {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text);
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 0.25rem;
    }
    .timestamp {
      font-family: 'DM Mono', monospace;
      font-size: 0.6rem;
      color: var(--muted);
      letter-spacing: 0.06em;
    }
    .refresh-btn {
      font-family: 'Nunito', sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--amber);
      background: rgba(245,166,35,0.12);
      border: 1px solid rgba(245,166,35,0.3);
      padding: 0.3rem 0.75rem;
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .refresh-btn:hover { background: rgba(245,166,35,0.22); transform: scale(1.03); }
    .refresh-btn:active { transform: scale(0.97); }
    .error-msg {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      color: #e05050;
      text-align: center;
      padding: 0.75rem 0 0;
      display: none;
      letter-spacing: 0.04em;
    }

    /* ── Notification subscribe card ── */
    .notif-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 1.1rem 1.4rem;
      box-shadow: 0 2px 0 rgba(255,255,255,0.9) inset, 0 4px 20px var(--shadow);
      margin-bottom: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.9rem;
    }
    .notif-card.hidden { display: none; }
    .notif-icon { font-size: 1.6rem; flex-shrink: 0; line-height: 1; }
    .notif-text { flex: 1; min-width: 0; }
    .notif-title { font-size: 0.82rem; font-weight: 700; color: var(--text); margin-bottom: 0.15rem; }
    .notif-desc { font-size: 0.68rem; color: var(--muted); line-height: 1.4; }
    .notif-btn {
      flex-shrink: 0;
      font-family: 'Nunito', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      border-radius: 20px;
      padding: 0.4rem 0.9rem;
      cursor: pointer;
      border: 1px solid;
      transition: background 0.2s, transform 0.1s, opacity 0.2s;
      white-space: nowrap;
    }
    .notif-btn:hover  { transform: scale(1.04); }
    .notif-btn:active { transform: scale(0.97); }
    .notif-btn.subscribe { color: #fff; background: var(--amber); border-color: var(--amber); }
    .notif-btn.subscribe:hover { background: #e09510; border-color: #e09510; }
    .notif-btn.unsubscribe { color: var(--muted); background: transparent; border-color: var(--border); }
    .notif-btn.unsubscribe:hover { background: rgba(245,166,35,0.08); }
    .notif-btn:disabled { opacity: 0.5; cursor: default; transform: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img class="logo-img" src="/static/logo_wbg.png" alt="OvenTime logo" />
      <div class="title-block">
        <h1>OvenTime</h1>
        <div class="subtitle">Réseau électrique · France</div>
      </div>
      <div class="live-pill">
        <div class="live-dot" id="liveDot"></div>
        <span class="live-label">Live</span>
      </div>
    </div>

    <!-- ── Carte principale : verdict clair ── -->
    <div class="card">
      <div class="verdict">
        <div class="verdict-status" id="verdictStatus">—</div>
        <div class="verdict-hint" id="verdictHint"></div>
      </div>
    </div>

    <!-- ── Carte score ── -->
    <div class="card">
      <div class="gauge-title">Green score du réseau</div>
      <div class="gauge-outer">
        <span class="gauge-label gauge-label-0">0</span>
        <span class="gauge-label gauge-label-100">100</span>
        <div class="gauge-bg"></div>
        <div class="gauge-fill" id="gaugeFill"></div>
        <div class="gauge-outline"></div>
        <span class="gauge-tri" id="gaugeTri">▲</span>
        <span class="gauge-score" id="gaugeScore">—</span>
      </div>
      <div class="tech-strip">
        <div class="tech-item">
          <span class="tech-label">Gaz</span>
          <span class="tech-val" id="detailGas">—</span>
        </div>
        <div class="tech-item">
          <span class="tech-label">Nuc</span>
          <span class="tech-val" id="detailNuclear">—</span>
        </div>
        <div class="tech-item">
          <span class="tech-label">Stock</span>
          <span class="tech-val" id="detailStorage">—</span>
        </div>
      </div>
    </div>

    <!-- ── Carte forward : fenêtre verte + timeline ── -->
    <div class="forward-card" id="forwardCard">
      <div class="forward-section-label">Évolution prévue</div>
      <div class="timeline-bar" id="timelineBar"></div>
      <div class="timeline-labels">
        <span id="tlLabelStart"></span>
        <span id="tlLabelEnd"></span>
      </div>
      <div class="forward-section-label" style="margin-top: 0.8rem;">Prochaine fenêtre la + verte</div>
      <div class="forward-window" id="forwardWindow">—</div>
    </div>

    <div class="footer">
      <span class="timestamp" id="timestamp">—</span>
      <button class="refresh-btn" onclick="fetchData()">↻ Actualiser</button>
    </div>

    <!-- ── Notification subscribe card ── -->
    <div class="notif-card hidden" id="notifCard" style="margin-top:0.9rem; margin-bottom:0">
      <div class="notif-icon" id="notifIcon">🔔</div>
      <div class="notif-text">
        <div class="notif-title" id="notifTitle">Alertes réseau</div>
        <div class="notif-desc" id="notifDesc">Sois notifié lors des périodes d'abondance 🍃 ou de forte tension 🔥</div>
      </div>
      <button class="notif-btn subscribe" id="notifBtn" onclick="toggleSubscription()">Activer</button>
    </div>

    <div class="error-msg" id="errorMsg">
      Impossible de contacter l'API — données de démo affichées
    </div>
  </div>

  <script>
    const API_URL = ""

    const STATUS_CONFIG = {
      leaf:   { emoji: "🍃", headline: "ABONDANCE !",      phrase: "Y a de l'électricité à ne savoir qu'en faire.",                          color: "#3cb96b" },
      green:  { emoji: "🟢", headline: "CA VA",            phrase: "On tire un peu sur le gaz, mais modérément.",                             color: "#52c97e" },
      orange: { emoji: "🟠", headline: "UN PEU TENDU",     phrase: "C'est pas le pire, mais on tire un peu sur le gaz quand même.",           color: "#e8804a" },
      red:    { emoji: "🔴", headline: "PAS MAINTENANT",   phrase: "Le système est tendu et les centrales gaz tournent à fond.",              color: "#e05050" },
      fire:   { emoji: "🔥", headline: "PIRE MOMENT !",    phrase: "Le système est très tendu, on a démarré les centrales les plus polluantes.", color: "#cc2e2e" },
    }

    const $ = id => document.getElementById(id)
    const pct = v => v !== null && v !== undefined ? `${Math.round(v * 100)}%` : "—"

    function setAccent(color) {
      document.documentElement.style.setProperty("--accent", color)
      $("liveDot").style.background = color
    }

    function render(data) {
      const cfg = STATUS_CONFIG[data.status] || { emoji: "?", headline: data.status, phrase: "", color: "#f5a623" }
      setAccent(cfg.color)

      $("verdictStatus").textContent = `${cfg.emoji} ${cfg.headline}`
      $("verdictStatus").style.color = cfg.color
      $("verdictHint").textContent = cfg.phrase

      // Gauge: -10..110 mapped across full width
      // score 0 = 8.3%, score 100 = 91.7% (range = 83.4%)
      const score = data.score
      const toPos = s => 8.3 + (s / 100) * 83.4
      const scorePct = Math.max(1, Math.min(99, toPos(score)))
      const zeroPct = 8.3

      const fill = $("gaugeFill")
      fill.style.background = cfg.color
      if (score >= 0) {
        fill.style.left = `${zeroPct}%`
        fill.style.width = `${scorePct - zeroPct}%`
      } else {
        fill.style.left = `${scorePct}%`
        fill.style.width = `${zeroPct - scorePct}%`
      }

      $("gaugeTri").style.left = `${scorePct}%`
      $("gaugeScore").style.left = `${scorePct}%`
      $("gaugeScore").textContent = `${Math.round(score)}%`

      const d = data.details || {}
      $("detailGas").textContent     = d.gasCCG_use_rate !== undefined ? pct(d.gasCCG_use_rate) : "—"
      $("detailNuclear").textContent = d.nuclear_use_rate !== undefined ? pct(d.nuclear_use_rate) : "—"
      $("detailStorage").textContent = d.storage_use_rate !== undefined ? pct(d.storage_use_rate) : "—"

      if (data.ts) {
        const dt = new Date(data.ts)
        $("timestamp").textContent = dt.toLocaleString("fr-FR", { dateStyle: "short", timeStyle: "short" })
      }
      $("errorMsg").style.display = "none"
    }

    const TIMELINE_COLORS = { green: "#4caf50", orange: "#ff9800", red: "#f44336" }

    let _tlTooltipTimer = null

    function renderTimeline(data) {
      const bar = $("timelineBar")
      if (!data.slots || data.slots.length === 0) return
      bar.innerHTML = ""
      const hm = d => new Date(d).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })

      // Tooltip element
      const tip = document.createElement("span")
      tip.className = "tl-tooltip"
      tip.id = "tlTooltip"
      bar.appendChild(tip)

      for (const slot of data.slots) {
        const d = document.createElement("div")
        d.style.background = TIMELINE_COLORS[slot.color] || TIMELINE_COLORS.orange
        d.title = hm(slot.t)
        d.addEventListener("click", e => {
          e.stopPropagation()
          const rect = d.getBoundingClientRect()
          const barRect = bar.getBoundingClientRect()
          tip.textContent = hm(slot.t)
          tip.style.left = `${rect.left - barRect.left + rect.width / 2}px`
          tip.classList.add("visible")
          clearTimeout(_tlTooltipTimer)
          _tlTooltipTimer = setTimeout(() => tip.classList.remove("visible"), 2000)
        })
        bar.appendChild(d)
      }

      // Dismiss on tap elsewhere
      document.addEventListener("click", () => {
        const t = $("tlTooltip")
        if (t) t.classList.remove("visible")
      })

      $("tlLabelStart").textContent = hm(data.slots[0].t)
      $("tlLabelEnd").textContent = hm(data.slots[data.slots.length - 1].t)
    }

    function renderWindow(data) {
      const start = new Date(data.nextwind_start)
      const end = new Date(data.nextwind_end)
      const now = new Date()

      const hm = d => d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })

      const startDay = new Date(start); startDay.setHours(0,0,0,0)
      const today = new Date(now); today.setHours(0,0,0,0)
      const tomorrow = new Date(today); tomorrow.setDate(tomorrow.getDate() + 1)

      let prefix = ""
      if (now >= start && now <= end) {
        prefix = "En cours · "
      } else if (startDay.getTime() === tomorrow.getTime() && start.getHours() > 6) {
        prefix = "Demain · "
      } else if (startDay.getTime() <= tomorrow.getTime() && (start.getHours() >= 22 || start.getHours() < 6)) {
        prefix = "Cette nuit · "
      } else if (startDay.getTime() !== today.getTime()) {
        prefix = start.toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit" }) + " · "
      }
      const when = `${prefix}${hm(start)} → ${hm(end)}`

      $("forwardWindow").textContent = when
    }

    async function fetchData() {
      try {
        const res = await fetch(`${API_URL}/diagnostic`)
        if (!res.ok) throw new Error(`HTTP ${res.status}`)
        render(await res.json())
      } catch (e) {
        console.error(e)
        $("errorMsg").style.display = "block"
        render(MOCK_DATA)
      }
      try {
        const res = await fetch(`${API_URL}/next/window`)
        if (res.ok) renderWindow(await res.json())
      } catch (e) {
        console.error("next/window:", e)
      }
      try {
        const res = await fetch(`${API_URL}/prices/timeline`)
        if (res.ok) renderTimeline(await res.json())
      } catch (e) {
        console.error("prices/timeline:", e)
      }
    }

    const MOCK_DATA = {
      ts: new Date().toISOString(),
      status: "green",
      score: 87.4,
      details: { gasCCG_use_rate: 0.12, nuclear_use_rate: 0.94, storage_phase: 0.61 }
    }

    fetchData()
    setInterval(fetchData, 5 * 60 * 1000)

    // ══════════════════════════════════════════════════════════════════
    // NOTIFICATIONS PUSH
    // ══════════════════════════════════════════════════════════════════

    let _swRegistration = null
    let _vapidPublicKey  = null

    function urlBase64ToUint8Array(b64) {
      const padded = b64.padEnd(b64.length + (4 - b64.length % 4) % 4, "=")
      const raw = atob(padded.replace(/-/g, "+").replace(/_/g, "/"))
      return Uint8Array.from([...raw].map(c => c.charCodeAt(0)))
    }

    async function getActiveSub() {
      if (!_swRegistration) return null
      return _swRegistration.pushManager.getSubscription()
    }

    function setNotifState(state) {
      const card = $("notifCard")
      const btn  = $("notifBtn")
      const icon = $("notifIcon")
      const title = $("notifTitle")
      const desc  = $("notifDesc")

      card.classList.remove("hidden")
      btn.disabled = false

      if (state === "unsupported") { card.classList.add("hidden"); return }
      if (state === "denied") {
        icon.textContent  = "🔕"
        title.textContent = "Notifications bloquées"
        desc.textContent  = "Active les notifications dans les réglages de ton navigateur."
        btn.style.display = "none"
        return
      }
      if (state === "subscribed") {
        icon.textContent  = "🔔"
        title.textContent = "Alertes activées"
        desc.textContent  = "Tu recevras une notif en cas d'abondance 🍃 ou de forte tension 🔥"
        btn.textContent   = "Désactiver"
        btn.className     = "notif-btn unsubscribe"
        btn.style.display = ""
        return
      }
      icon.textContent  = "🔔"
      title.textContent = "Alertes réseau"
      desc.textContent  = "Sois notifié lors des périodes d'abondance 🍃 ou de forte tension 🔥"
      btn.textContent   = "Activer"
      btn.className     = "notif-btn subscribe"
      btn.style.display = ""
    }

    async function initPush() {
      if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
        setNotifState("unsupported"); return
      }
      try {
        _swRegistration = await navigator.serviceWorker.register(`/sw.js?appUrl=${encodeURIComponent(API_URL)}`, { scope: "/" })
      } catch (e) { console.error("SW registration failed:", e); setNotifState("unsupported"); return }
      try {
        const r = await fetch(`${API_URL}/vapid-public-key`)
        const data = await r.json()
        _vapidPublicKey = data.publicKey
      } catch (e) { console.error("Could not fetch VAPID public key:", e); setNotifState("unsupported"); return }

      if (Notification.permission === "denied") { setNotifState("denied"); return }
      const sub = await getActiveSub()
      setNotifState(sub ? "subscribed" : "unsubscribed")
    }

    async function toggleSubscription() {
      const btn = $("notifBtn")
      btn.disabled = true
      const sub = await getActiveSub()

      if (sub) {
        try {
          await fetch(`${API_URL}/wsubs`, { method: "DELETE", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ endpoint: sub.endpoint }) })
          await sub.unsubscribe()
          setNotifState("unsubscribed")
        } catch (e) { console.error(e); btn.disabled = false }
      } else {
        let permission = Notification.permission
        if (permission === "default") permission = await Notification.requestPermission()
        if (permission !== "granted") { setNotifState("denied"); return }
        try {
          const keyArray = urlBase64ToUint8Array(_vapidPublicKey)
          const newSub = await _swRegistration.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: keyArray })
          await fetch(`${API_URL}/wsubs`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(newSub.toJSON()) })
          setNotifState("subscribed")
        } catch (e) { console.error(e); btn.disabled = false }
      }
    }

    initPush()
  </script>
</body>
</html>
